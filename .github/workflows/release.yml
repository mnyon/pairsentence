name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches manifest
        run: node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("plugin/plugin.json")); if(process.env.GITHUB_REF_NAME!=="v"+m.version)process.exit(1);'
      - run: npm test
      - run: npm run build:plugin
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/package.zip --draft --title "$GITHUB_REF_NAME" --generate-notes
